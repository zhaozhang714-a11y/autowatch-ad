// retry build v41
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autowatch.ad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.autowatch.ad'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 屏幕文字识别（内置中文模型，离线可用）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
}
